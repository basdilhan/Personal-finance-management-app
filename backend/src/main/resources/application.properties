spring.application.name=backend

# PostgreSQL Database Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dream_saver}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:123456}

# Hibernate Settings
# none: schema already exists via dreamsaver_schema.sql - no auto migration needed
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server Port
server.port=${PORT:8080}

# External AI / ML Service Configuration
ml.service.url=${ML_URL:https://personal-finance-management-app-1f0u.onrender.com}
ml.service.api.key=${ML_API_KEY:dev_secret_key_123}

# (Deprecated) Old Gemini key, to be removed if migrating fully to HuggingFace
gemini.api.key=${GEMINI_API_KEY:PLACEHOLDER_KEY}